<!DOCTYPE html>
<html>
<head>
    <title>Sidebar Test</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <input type="checkbox" id="checkbox">
    
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-left-container">
                <label for="checkbox" class="menu-toggle">
                    <i class="fa fa-bars"></i>
                </label>
                <div class="logo">
                    <i class="fa fa-tasks"></i>
                    Task<span class="logo-text-opacity">Master</span>
                </div>
            </div>
            <div class="header-right">
                <div class="user-info">
                    <div class="user-avatar">O</div>
                    <div class="user-details">
                        <div class="user-name">Test User</div>
                        <div class="user-role">admin</div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Sidebar -->
    <nav class="side-bar">
        <div class="user-p">
            <div class="user-avatar">O</div>
            <div class="user-name">Test User</div>
            <div class="user-role">admin</div>
        </div>
        
        <div class="nav-menu">
            <div class="nav-item">
                <a href="#" class="nav-link active">
                    <i class="fa fa-tachometer"></i>
                    <span>Dashboard</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="#" class="nav-link">
                    <i class="fa fa-users"></i>
                    <span>Manage Users</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="#" class="nav-link">
                    <i class="fa fa-bell"></i>
                    <span>Notifications</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Body Content -->
    <div class="body">
        <section class="section-1">
            <h1>Test Page</h1>
            <p>This is a test page to check if the sidebar is working properly.</p>
            <p>The sidebar should be visible on the left side.</p>
            <p>On mobile, click the hamburger menu to toggle the sidebar.</p>
        </section>
    </div>
</body>
</html>
